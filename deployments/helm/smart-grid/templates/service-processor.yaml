{{- if .Values.processor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smart-grid.name" . }}-processor
  labels:
    {{- include "smart-grid.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
spec:
  selector:
    app.kubernetes.io/component: processor
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.processor.service.port }}
      targetPort: http
{{- end }}
