{{- if .Values.ingestion.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-grid.name" . }}-ingestion
  labels:
    {{- include "smart-grid.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  replicas: {{ .Values.ingestion.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: ingestion
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ingestion
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.ingestion.service.port }}"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: ingestion
          image: "{{ .Values.ingestion.image.repository }}:{{ .Values.ingestion.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.ingestion.service.port }}
              name: http
          env:
            - name: APP_NAME
              value: {{ .Values.ingestion.env.APP_NAME | quote }}
            - name: HTTP_ADDR
              value: {{ .Values.ingestion.env.HTTP_ADDR | quote }}
            - name: MQTT_BROKER_URL
              value: {{ .Values.dependencies.mqtt.brokerURL | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.dependencies.kafka.brokers | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}
{{- end }}
