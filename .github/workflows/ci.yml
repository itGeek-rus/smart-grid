name: ci
on:
  pull_request:
    push:
      branches: [main]
jobs:
  cleancode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -race -count=1
      - run: go build ./cmd/...